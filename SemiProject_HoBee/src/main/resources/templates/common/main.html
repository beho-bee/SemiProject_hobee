<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>HO-BEE</title>

  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/main.css">

<th:block th:replace="~{common/common}"></th:block>
</head>
<body>

<th:block th:replace="~{common/fragments/header}"></th:block>

<main>

  <!-- Hero Banner -->
  <section class="hero">
    <div class="hero-text">
      <h1>HO-BEE</h1>
      <p>Find your hobby!!</p>
    </div>
  </section>

  <!-- Intro -->
  <section class="intro">
    <div class="intro-card">
      <div class="intro-logo">
        <img src="/images/logo/logo-header.png" alt="Ho-bee 메인 로고">
      </div>
      <div class="intro-text">
        <p>
          Ho-bee는 취미를 통해 사람과 사람을 연결하는 커뮤니티 플랫폼입니다.<br><br>
          나에게 맞는 취미를 발견하고, 같은 관심사를 가진 사람들과 소통하며<br><br>
          일상에 새로운 즐거움을 더해보세요.
        </p>
      </div>
    </div>
  </section>

  <!-- Categories -->
  <th:block th:replace="~{common/fragments/hobbyCategory}"></th:block>
  
</main>

<th:block th:replace="~{common/fragments/footer}"></th:block>

  <!-- script 추가-->
   <script src="/js/main.js"></script>

</body>
</html>
