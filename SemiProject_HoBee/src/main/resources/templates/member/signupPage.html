<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>

    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/member/validation.css">
    <link rel="stylesheet" th:href="@{/css/member/signup.css}">

</head>
<body>
    <th:block th:replace="~{common/fragments/header}"></th:block>

    <main>
        <h1>회원가입</h1>

        <form action="/member/signUp" method="post" id="signUpForm" name="signUpForm">
            <section>

                <h3>* 이메일</h3>
                <div class="signUp-input">
                    <input type="email" placeholder="이메일" id="memberEmail" name="memberEmail" autocomplete="off">
                    <button type="button" id="sendAuthKeyBtn">인증번호 받기</button>
                </div>
                <span class="signUp-message" id="emailMessage">메일을 받을 수 있는 이메일을 입력해주세요.</span>

                <h3>* 인증번호</h3>
                <div class="signUp-input">
                    <input type="text" maxlength="6" placeholder="인증번호" id="authKey" name="authKey" autocomplete="off">
                    <button type="button" id="checkAuthKeyBtn">인증하기</button>
                </div>
                <span class="signUp-message" id="authKeyMessage">인증번호 6자리를 입력해주세요.</span>

                <h3>* 아이디</h3>
                <div class="signUp-input">
                    <input type="text" placeholder="영어/숫자 6~12 사이로 입력해주세요." id="memberId" name="memberId" minlength="6" maxlength="12">
                </div>
                <span class="signUp-message" id="idMessage">아이디를 입력해주세요.</span>

                <h3>* 비밀번호</h3>
                <div class="signUp-input">
                    <input type="password" placeholder="영어, 숫자, 특수문자(!@#_-) 포함 6~20자 사이로 입력해주세요." id="memberPw" name="memberPw" minlength="6" maxlength="12">
                </div>
                <span class="signUp-message" id="pwMessage">비밀번호를 입력해주세요.</span>

                <h3>* 비밀번호 확인</h3>
                <div class="signUp-input">
                    <input type="password" placeholder="비밀번호 확인" id="memberPwConfirm" name="memberPwConfirm">
                </div>
                <span class="signUp-message" id="pwConMessage">비밀번호 확인을 입력해주세요.</span>

                <h3>* 이름</h3>
                <div class="signUp-input">
                    <input type="text" placeholder="이름" id="memberName" name="memberName">
                </div>
                <span class="signUp-message" id="nameMessage">이름을 입력해주세요.</span>
                
                <h3>* 닉네임</h3>
                <div class="signUp-input">
                    <input type="text" placeholder="닉네임(2~8글자)" id="memberNickname" name="memberNickname"  minlength="2" maxlength="8">
                </div>
                <span class="signUp-message" id="nickMessage">닉네임을 입력해주세요.</span>

                <h3>취미</h3>
                <div class="signUp-input">
                    <div id="mainCategoryArea">
                        <label><input type="radio" name="mainHobby" value="art"> 문화·예술</label>
                        <label><input type="radio" name="mainHobby" value="selfDevelop"> 자기계발</label>
                        <label><input type="radio" name="mainHobby" value="sports"> 운동·레저</label>
                        <label><input type="radio" name="mainHobby" value="social"> 사회 교류 </label>
                        <label><input type="radio" name="mainHobby" value="shopping"> 수집·소비</label>
                    </div>

                    <h3 id="subTitle" style="display:none;">세부 취미 선택</h3> <!-- display:none : 숨김-->
                    <div id="CategoryArea" class="categoryHobby"></div>
                </div>

                <h3>소개</h3>
                <div class="signUp-input">
                    <textarea name="memberIntroduction" id="introdution" placeholder="소개 글 작성" 
                     style="width: 500px; height: 300px;"></textarea>
                </div>

                <h3>* 전화번호</h3>
                <div class="signUp-input">
                    <input type="tel" placeholder="전화번호(숫자만 입력)" id="memberTel" name="memberTel" maxlength="12">
                </div>
                <span class="signUp-message" id="telMessage">전화번호를 입력해주세요.</span>
   
                <!-- 주소 입력 -->
                <label for="memberAddress"><h3>주소</h3></label>

                <div class="signUp-input-area">
                <input type="text" name="memberAddress" placeholder="우편번호" maxlength="6" id="postcode">                       
                
                <button type="button" id="searchAddress">검색</button>
                </div>

                <div class="signUp-input-area">
                <input type="text" name="memberAddress" placeholder="도로명/지번 주소" id="address">
                </div>

                <div class="signUp-input-area">
                <input type="text" name="memberAddress" placeholder="상세 주소" id="detailAddress">
                </div>

                <button id="signUpBtn">가입하기</button>

            </section>
        </form>
    </main>

    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    
    <script src="/js/member/signUp.js"></script>

    <th:block th:replace="~{common/fragments/footer}"></th:block>
    
</body>
</html>
